<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eff5ed"><title>Hjernetrim</title><style>body{font:20px system-ui,sans-serif;background:#eff5ed;color:#172d25;margin:0}main{max-width:780px;margin:auto;padding:22px}h1{font-size:2rem}button{font:inherit;cursor:pointer;border:2px solid #315e4b;border-radius:14px;padding:15px;background:white;color:#172d25;min-height:58px}button:focus-visible{outline:4px solid #e59e38}button:disabled{opacity:.55}.primary{background:#315e4b;color:white}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.panel{background:white;padding:20px;border-radius:18px;margin:16px 0}#board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.tile{aspect-ratio:1;font-size:2rem;padding:4px}.selected{background:#e3b65b}.hidden{display:none}.muted{color:#52645b}#status{min-height:2em;font-weight:600}@media(max-width:450px){#board{gap:6px}.tile{font-size:1.5rem}main{padding:12px}}</style></head><body><main><h1>Hjernetrim</h1><p class="muted">Små utfordringer, i ditt tempo.</p><section id="home"><div class="panel"><h2>Din fremgang</h2><p id="progress"></p><p>Spill litt når det passer. Ingen tidsfrist.</p></div><div class="cards"><button onclick="start('memory')">Hukommelseskort</button><button onclick="start('pattern')">Finn mønsteret</button><button onclick="start('puzzle')">Tallpuslespill</button></div></section><section id="game" class="hidden"><button onclick="goHome()">← Tilbake</button><h2 id="gameTitle"></h2><p id="instructions"></p><div id="board"></div><p id="status" role="status" aria-live="polite"></p><button id="again" class="primary hidden" onclick="start(current)">Spill igjen</button></section></main><script>
const key='hjernetrim-v1';let stats;try{stats=JSON.parse(localStorage.getItem(key))||{sessions:0,wins:0,days:[],levels:{memory:1,pattern:1,puzzle:1}}}catch{stats={sessions:0,wins:0,days:[],levels:{memory:1,pattern:1,puzzle:1}}}let current='',turns=0,selected=[],matched=0,locked=false,sequence=[],expected=0,nums=[],moves=0;const board=document.getElementById('board'),status=document.getElementById('status');function save(){localStorage.setItem(key,JSON.stringify(stats));renderStats()}function renderStats(){document.getElementById('progress').textContent='Økter: '+stats.sessions+' · Fullførte spill: '+stats.wins+' · Aktive dager: '+stats.days.length}function goHome(){document.getElementById('home').classList.remove('hidden');document.getElementById('game').classList.add('hidden');renderStats()}function shuffle(a){return a.sort(()=>Math.random()-.5)}function begin(){stats.sessions++;const d=new Date().toLocaleDateString('sv-SE');if(!stats.days.includes(d))stats.days.push(d);save()}function finish(){stats.wins++;stats.levels[current]=Math.min(6,(stats.levels[current]||1)+1);save();status.textContent='Bra jobbet! Du fullførte oppgaven.';document.getElementById('again').classList.remove('hidden');locked=true}function start(type){current=type;turns=0;matched=0;moves=0;locked=false;selected=[];expected=0;board.innerHTML='';status.textContent='';document.getElementById('again').classList.add('hidden');document.getElementById('home').classList.add('hidden');document.getElementById('game').classList.remove('hidden');begin();if(type==='memory')memory();else if(type==='pattern')pattern();else puzzle()}function tile(label,action){let b=document.createElement('button');b.className='tile';b.textContent=label;b.addEventListener('click',action);board.appendChild(b);return b}
function memory(){document.getElementById('gameTitle').textContent='Hukommelseskort';document.getElementById('instructions').textContent='Finn to like symboler.';const icons=['●','◆','★','♥','☀','☂','♫','✿'];const pairs=Math.min(8,3+Math.floor((stats.levels.memory||1)/2));let values=shuffle([...icons.slice(0,pairs),...icons.slice(0,pairs)]);board.style.gridTemplateColumns='repeat(4,1fr)';values.forEach((v,i)=>{const b=tile('?',()=>{if(locked||b.disabled||selected.includes(i)||selected.length===2)return;b.textContent=v;selected.push(i);if(selected.length===2){turns++;const [a,c]=selected;if(values[a]===values[c]){board.children[a].disabled=true;board.children[c].disabled=true;matched++;selected=[];if(matched===pairs)finish()}else{locked=true;setTimeout(()=>{board.children[a].textContent='?';board.children[c].textContent='?';selected=[];locked=false},850)}}});b.setAttribute('aria-label','Kort '+(i+1))})}
function pattern(){document.getElementById('gameTitle').textContent='Finn mønsteret';document.getElementById('instructions').textContent='Trykk på tallet som kommer neste i rekken.';let step=1+Math.floor(Math.random()*Math.min(5,stats.levels.pattern||1));let first=1+Math.floor(Math.random()*9);let answer=first+step*4;status.textContent=[0,1,2,3].map(i=>first+i*step).join('  –  ')+'  –  ?';board.style.gridTemplateColumns='repeat(2,1fr)';shuffle([answer,answer+step,answer-step,answer+step*2]).forEach(n=>tile(n,()=>{if(locked)return;if(n===answer)finish();else status.textContent='Prøv igjen. Se på forskjellen mellom tallene.'}))}
function puzzle(){document.getElementById('gameTitle').textContent='Tallpuslespill';document.getElementById('instructions').textContent='Flytt tallene til riktig rekkefølge ved å trykke på en brikke ved siden av det tomme feltet.';board.style.gridTemplateColumns='repeat(3,1fr)';nums=[1,2,3,4,5,6,7,8,0];let last=-1;const steps=8+(stats.levels.puzzle||1)*3;for(let k=0;k<steps;k++){let zero=nums.indexOf(0),adj=[zero-3,zero+3,...(zero%3?[zero-1]:[]),...(zero%3<2?[zero+1]:[])].filter(x=>x>=0&&x<9&&x!==last);let j=adj[Math.floor(Math.random()*adj.length)];[nums[zero],nums[j]]=[nums[j],nums[zero]];last=zero}drawPuzzle()}function drawPuzzle(){board.innerHTML='';nums.forEach((n,i)=>{let b=tile(n||' ',()=>{if(locked||!n)return;let z=nums.indexOf(0);if((Math.floor(z/3)===Math.floor(i/3)&&Math.abs(z-i)===1)||Math.abs(z-i)===3){[nums[z],nums[i]]=[nums[i],nums[z]];moves++;drawPuzzle();if(nums.every((v,j)=>v===(j+1)%9))finish()}});if(!n)b.disabled=true})}renderStats();
</script></body></html>
