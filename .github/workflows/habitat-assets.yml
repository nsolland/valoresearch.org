          curl -L --fail 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-de54-8246-b68c-1fd062e682a6/raw?se=2026-09-26T20%3A14%3A47Z&sp=r&sv=2026-02-06&sr=b&scid=2d520f28-c1fc-5c3d-a984-3132e585c855&skoid=82a3371f-2f6c-4f81-8a78-2701b362559b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-26T18%3A38%3A37Z&ske=2026-09-27T18%3A38%3A37Z&sks=b&skv=2026-02-06&sig=9LYky42aLQQu9bL%2BAfi/xCjVZAQv0sZ3kTLUTFQyfPw%3D' -o habitat/assets/pilot-farm.png
