name: Import Habitat assets

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/habitat-assets.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Habitat images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p habitat/assets
          curl -L --fail 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-8988-8246-975e-2c02eb7c87c3/raw?se=2026-09-26T20%3A14%3A24Z&sp=r&sv=2026-02-06&sr=b&scid=ccfa35b5-c39c-560c-a26a-f28d93d5aff6&skoid=82a3371f-2f6c-4f81-8a78-2701b362559b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-26T08%3A06%3A38Z&ske=2026-09-27T08%3A06%3A38Z&sks=b&skv=2026-02-06&sig=soIbEAMh0Wj6lqMSYQJgsXVvLszFZRLqC9%2Boy0LIHio%3D' -o habitat/assets/hero-fjord.png
