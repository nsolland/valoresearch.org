          curl -L --fail 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-6654-8246-8d46-e688239c2cd5/raw?se=2026-09-26T20%3A15%3A44Z&sp=r&sv=2026-02-06&sr=b&scid=eda1d2b4-ed0c-5d21-bc3e-decd4d7773c5&skoid=82a3371f-2f6c-4f81-8a78-2701b362559b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-26T07%3A10%3A13Z&ske=2026-09-27T07%3A10%3A13Z&sks=b&skv=2026-02-06&sig=RisqXPTxexAtknMBX7CGB14Gm%2BVuxosc0PVipimapmk%3D' -o habitat/assets/architecture-exploded.png
          curl -L --fail 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-5d9c-8246-854d-1d1eb1843e8e/raw?se=2026-09-26T20%3A15%3A51Z&sp=r&sv=2026-02-06&sr=b&scid=77d36af2-c31f-598f-9c91-d157dda6f4de&skoid=82a3371f-2f6c-4f81-8a78-2701b362559b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-26T06%3A02%3A06Z&ske=2026-09-27T06%3A02%3A06Z&sks=b&skv=2026-02-06&sig=sHk/wEMFfxU4sIO235MiOSvaVDjTwuM%2BO5ikt8/rlcU%3D' -o habitat/assets/module-ecosystem.png
      - name: Commit assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add habitat/assets
          git commit -m 'Add Habitat visual assets' || exit 0
          git push
