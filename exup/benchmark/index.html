<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EXUP Benchmark Access</title><style>:root{--bg:#050505;--gold:#d4af37;--gold2:#f0d58a;--white:#f7f4ec;--muted:#a7a39a;--line:#292416}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#19150b 0,#090806 28%,#050505 62%);color:var(--white);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.wrap{max-width:900px;margin:auto;padding:0 28px}.nav{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1d1b17}.brand,.back{color:var(--white);text-decoration:none}.back{color:var(--muted)}main{padding:84px 0}.kicker{color:var(--gold2);letter-spacing:.24em;text-transform:uppercase;font-size:13px}h1{font-size:clamp(42px,8vw,78px);line-height:.98;letter-spacing:-.045em;margin:18px 0 24px}.lead{font-size:22px;color:#ded9cf;max-width:720px}.panel{margin-top:38px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(180deg,#0e0c08,#080807);padding:30px}.field{display:grid;gap:8px;margin:16px 0}label{color:var(--muted);font-size:14px}input{width:100%;background:#080807;border:1px solid #2a2519;color:var(--white);border-radius:12px;padding:14px;font:inherit}.btn{border:0;cursor:pointer;color:#090806;background:linear-gradient(135deg,var(--gold2),var(--gold));padding:13px 19px;border-radius:999px;font-weight:700}.status{margin-top:16px;color:var(--muted)}.ok{color:#d8c078}.denied{color:#d49a8b}.workspace{display:none;margin-top:28px;padding:22px;border:1px solid #2a2519;border-radius:18px;background:#090908}.workspace b{color:var(--gold2)}</style></head><body><div class="wrap"><nav class="nav"><a class="brand" href="/exup/">EXUP</a><a class="back" href="/exup/access/">Request access</a></nav><main><div class="kicker">Protected benchmark</div><h1>EXUP Benchmark.</h1><p class="lead">Access is identity-based, individually approved and time-limited.</p><div class="panel" id="login"><div class="field"><label for="email">Approved email</label><input id="email" type="email" autocomplete="email" placeholder="you@company.com"></div><button class="btn" id="send">Send secure sign-in link</button><div class="status" id="status"></div></div><div class="workspace" id="workspace"><b>Access granted</b><p id="grant"></p><p>Your benchmark workspace is enabled for the approved scope. The execution surface is exposed only after the access grant is valid.</p><button class="btn" id="logout">Sign out</button></div></main></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const sb=createClient('https://ouenjnhucxfpmfootfgx.supabase.co','sb_publishable_F0HiuiHXyHGozfz2mJ59Fg_kXtb4TpU');const status=document.querySelector('#status'),workspace=document.querySelector('#workspace'),login=document.querySelector('#login');async function check(){const{data:{session}}=await sb.auth.getSession();if(!session)return;const email=session.user.email||'';const{data,error}=await sb.from('exup_access_grants').select('status,scope,expires_at').eq('email',email).maybeSingle();if(error||!data||data.status!=='approved'||new Date(data.expires_at)<=new Date()){status.textContent='Signed in, but no active EXUP access grant exists for this identity.';status.className='status denied';return}login.style.display='none';workspace.style.display='block';document.querySelector('#grant').textContent=`Scope: ${data.scope} · Access expires ${new Date(data.expires_at).toLocaleString()}.`;}document.querySelector('#send').onclick=async()=>{const email=document.querySelector('#email').value.trim();if(!email){status.textContent='Enter your approved email.';return}status.textContent='Sending…';const{error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+'/exup/benchmark/'}});status.textContent=error?error.message:'Secure sign-in link sent. Use the same approved email identity.';status.className='status '+(error?'denied':'ok')};document.querySelector('#logout').onclick=async()=>{await sb.auth.signOut();location.reload()};sb.auth.onAuthStateChange(()=>check());check();</script></body></html>
